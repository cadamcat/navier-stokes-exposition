<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1070" viewBox="0 0 1400 1070">
<title>The four alternatives</title>
<desc>The film's balanced A–D matrix: whole space and unit torus in columns, global smooth existence and admissible breakdown in rows. No implication runs between the rows.</desc>
<rect width="1400" height="1070" fill="#F7F4EC"/>
<text x="700.0" y="65.0" font-family="'Source Sans 3', sans-serif" font-size="36" font-weight="600" fill="#1C1B19" text-anchor="middle"><tspan x="700.0" dy="0.0">every viscosity <tspan font-family="KaTeX_Math, serif" font-style="italic">ν</tspan>&gt;0</tspan></text>
<text x="356.0" y="140.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="600" fill="#1C1B19" text-anchor="middle"><tspan x="356.0" dy="0.0">whole space</tspan></text>
<text x="1044.0" y="140.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="600" fill="#1C1B19" text-anchor="middle"><tspan x="1044.0" dy="0.0">unit torus</tspan></text>
<text x="60.0" y="210.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">global smooth existence</tspan></text>
<rect x="36.0" y="238.0" width="640.0" height="214.0" rx="6" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1.6"/>
<text x="60.0" y="288.0" font-family="'Source Sans 3', sans-serif" font-size="36" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">A</tspan></text>
<text x="60.0" y="348.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">every admissible initial velocity;</tspan><tspan x="60.0" dy="44.0">force = 0</tspan></text>
<rect x="724.0" y="238.0" width="640.0" height="214.0" rx="6" fill="#FBF8F1" stroke="#D8D2C4" stroke-width="1.6"/>
<text x="748.0" y="288.0" font-family="'Source Sans 3', sans-serif" font-size="36" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="748.0" dy="0.0">B</tspan></text>
<text x="748.0" y="348.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="748.0" dy="0.0">every admissible initial velocity;</tspan><tspan x="748.0" dy="44.0">force = 0</tspan></text>
<text x="60.0" y="494.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">admissible breakdown</tspan></text>
<text x="700.0" y="532.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="middle"><tspan x="700.0" dy="0.0"><tspan fill="#B7791F" font-weight="600">claimed</tspan> · announced 2026 construction</tspan></text>
<rect x="36.0" y="552.0" width="1328.0" height="346.0" rx="6" fill="#FBF8F1" stroke="#B7791F" stroke-width="2.2"/>
<line x1="700.0" y1="552.0" x2="700.0" y2="898.0" stroke="#B7791F" stroke-width="2.2" stroke-linecap="round"/>
<text x="60.0" y="602.0" font-family="'Source Sans 3', sans-serif" font-size="36" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">C</tspan></text>
<text x="60.0" y="664.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">choose initial velocity and smooth force;</tspan><tspan x="60.0" dy="46.0">exclude every global admissible pair</tspan></text>
<line x1="60.0" y1="770.0" x2="652.0" y2="770.0" stroke="#D8D2C4" stroke-width="1.6" stroke-linecap="round"/>
<text x="60.0" y="834.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="60.0" dy="0.0">uniformly finite whole-space energy</tspan></text>
<text x="748.0" y="602.0" font-family="'Source Sans 3', sans-serif" font-size="36" font-weight="600" fill="#1C1B19" text-anchor="start"><tspan x="748.0" dy="0.0">D</tspan></text>
<text x="748.0" y="664.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="748.0" dy="0.0">choose initial velocity and smooth force;</tspan><tspan x="748.0" dy="46.0">exclude every global admissible pair</tspan></text>
<line x1="748.0" y1="770.0" x2="1340.0" y2="770.0" stroke="#D8D2C4" stroke-width="1.6" stroke-linecap="round"/>
<text x="748.0" y="834.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="start"><tspan x="748.0" dy="0.0">periodic velocity and pressure</tspan></text>
<text x="700.0" y="970.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#1C1B19" text-anchor="middle"><tspan x="700.0" dy="0.0">The official formulation asks for any one alternative.</tspan></text>
<text x="700.0" y="1030.0" font-family="'Source Sans 3', sans-serif" font-size="32" font-weight="400" fill="#5E5B55" text-anchor="middle"><tspan x="700.0" dy="0.0">A/B remain open in the sources reviewed</tspan></text>
</svg>
