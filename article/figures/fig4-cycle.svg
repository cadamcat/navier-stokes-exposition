<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
<title>Residual improvement is an entire cycle</title>
<desc>Four corrections in a loop. Pressure is rebuilt and the full residual, including the axial pressure term, is updated between every pair, including the return. Orders continue without a last rung. A separate shrinking cutoff realizes a smooth field.</desc>
