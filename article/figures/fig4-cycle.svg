<text x="271.0" y="528.0" font-family="'Source Sans 3', sans-serif" font-size="20" font-weight="400" fill="#1C1B19" text-anchor="middle"><tspan x="271.0" dy="0.0">preserve two integral constraints;</tspan><tspan x="271.0" dy="30.0">cancel the linear contributions</tspan><tspan x="271.0" dy="30.0">to three defects (<tspan font-family="KaTeX_Math, serif" font-style="italic">P</tspan>, <tspan font-family="KaTeX_Math, serif" font-style="italic">J</tspan><tspan font-size="65%" baseline-shift="sub"><tspan font-family="KaTeX_Math, serif" font-style="italic">θ</tspan></tspan>, <tspan font-family="KaTeX_Math, serif" font-style="italic">J</tspan><tspan font-size="65%" baseline-shift="sub"><tspan font-family="KaTeX_Math, serif" font-style="italic">z</tspan></tspan>).</tspan><tspan x="271.0" dy="30.0">Nonlinear remainders persist</tspan><tspan x="271.0" dy="30.0">with improved decay.</tspan></text>
