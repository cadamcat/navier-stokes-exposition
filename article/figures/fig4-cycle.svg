<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1460" viewBox="0 0 1400 1460">
<title>Residual improvement is an entire cycle</title>
<desc>Four ordered corrections with a return track. The shared note applies after each correction: reconstruct pressure and update the full residual, including its axial pressure contribution. Orders continue without a last rung; a separate shrinking cutoff realizes a smooth field. The two-row proved inset compares velocity multiplication with localization of a vector potential.</desc>
