.clause-code .lean-line { line-height: 1.4; }
.code-clause { background-repeat: no-repeat; background-position: left bottom; }
.code-nu { color: var(--viscosity); }
.code-u { color: var(--velocity); }
.code-f { color: var(--force); }
.estimate-diff { color: var(--stress); }
.equation .katex-display > .katex { text-align: left; }
.clause.on { background: var(--paper-raised); }
